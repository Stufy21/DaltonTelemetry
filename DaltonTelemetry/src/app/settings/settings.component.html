@if (importBanner()) {
  <div class="banner">
    <span>{{ importBanner() }}</span>
    <button class="banner-dismiss" type="button" (click)="dismissBanner()">×</button>
  </div>
}

<div class="settings-container">
  <h1>Claude Settings</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <section>
      <label for="model">Model</label>
      <select id="model" formControlName="model">
        @for (m of models; track m.id) {
          <option [value]="m.id">{{ m.label }}</option>
        }
      </select>
    </section>

    <section>
      <label for="apiKey">API Key</label>
      <input
        id="apiKey"
        type="password"
        formControlName="apiKey"
        placeholder="sk-ant-..."
        autocomplete="off"
      />
      <p class="hint">Stored locally. Never included in share links.</p>
    </section>

    <section>
      <label for="maxTokens">Max Tokens</label>
      <input
        id="maxTokens"
        type="number"
        formControlName="maxTokens"
        min="1"
        max="200000"
      />
    </section>

    <section>
      <label for="temperature">
        Temperature
        <span class="value">{{ form.get('temperature')?.value }}</span>
      </label>
      <input
        id="temperature"
        type="range"
        formControlName="temperature"
        min="0"
        max="2"
        step="0.1"
      />
    </section>

    <section>
      <label for="systemPrompt">System Prompt</label>
      <textarea
        id="systemPrompt"
        formControlName="systemPrompt"
        rows="6"
        placeholder="You are a helpful assistant..."
      ></textarea>
    </section>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="form.invalid">Save</button>
      <button type="button" class="btn-secondary" (click)="reset()">Reset to defaults</button>
      <button type="button" class="btn-share" (click)="copyShareLink()">
        {{ copied() ? 'Link copied!' : 'Copy share link' }}
      </button>
    </div>
  </form>
</div>
