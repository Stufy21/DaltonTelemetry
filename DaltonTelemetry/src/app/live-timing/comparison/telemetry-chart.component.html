<div class="head">
  <span class="title"
    >{{ title() }}<span class="unit">{{ unit() }}</span></span
  >
  <span class="readouts">
    @for (r of readouts(); track r.series.id) {
      <span class="readout">
        <span class="key" [class.dashed]="r.series.dashed" [style.--c]="r.series.colour"></span>
        {{ r.series.label }}
        <b>{{ r.value ?? '–' }}</b>
      </span>
    }
  </span>
</div>

<div
  class="plot"
  [class.selecting]="anchor() !== null"
  (pointermove)="onMove($event)"
  (pointerleave)="hoverChange.emit(null)"
  (click)="onClick($event)"
>
  <svg
    viewBox="0 0 1000 100"
    preserveAspectRatio="none"
    aria-hidden="true"
    [class.zoomed]="zoom() !== null"
  >
    <line class="grid" x1="0" y1="0" x2="1000" y2="0" />
    <line class="grid" x1="0" y1="50" x2="1000" y2="50" />
    <line class="grid" x1="0" y1="100" x2="1000" y2="100" />
    @for (p of paths(); track p.series.id) {
      <path
        class="line"
        [class.dashed]="p.series.dashed"
        [attr.d]="p.d"
        [style.stroke]="p.series.colour"
      />
    }
  </svg>
  @if (selection(); as s) {
    <span class="selection" [style.left.%]="s.left" [style.width.%]="s.width"></span>
  }
  @if (anchorAt(); as a) {
    <span class="anchor" [style.left.%]="a * 100"></span>
  }
  <span class="scale top">{{ top() }}</span>
  @if (zoom() !== null) {
    <span class="scale bottom">{{ bottom() }}</span>
  }
  @if (cursor(); as c) {
    <span class="cursor" [style.left.%]="c * 100"></span>
  }
</div>
