  <text x="210" y="75" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">DALTON</text>
  
  <text x="215" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" font-style="italic" fill="url(#f1Red)" letter-spacing="7">TELEMETRY</text>
  
  <g transform="translate(465, 42)">
