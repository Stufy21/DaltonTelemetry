    <line x1="20" y1="100" x2="630" y2="100" />
    <line x1="20" y1="120" x2="630" y2="120" />
    
    <line x1="40" y1="10" x2="40" y2="130" />
    <line x1="80" y1="10" x2="80" y2="130" />
    <line x1="120" y1="10" x2="120" y2="130" />
    <line x1="160" y1="10" x2="160" y2="130" />
  </g>

  <g transform="translate(25, 15)">
    <path d="M 15 95 L 15 75 Q 35 40 50 65 T 90 35 T 120 85 T 145 55 L 145 95 Z" fill="url(#glowGrad)" />
    <path d="M 15 75 Q 35 40 50 65 T 90 35 T 120 85 T 145 55" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)" />
    <circle cx="50" cy="65" r="3" fill="#00E5FF" />
    <circle cx="90" cy="35" r="3" fill="#FF0026" />
    <circle cx="120" cy="85" r="3" fill="#00E5FF" />

    <path d="M 25 50 L 40 42 L 55 52 L 45 58 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 40 55 C 60 45, 80 40, 110 65 C 125 75, 140 76, 155 76 L 152 82 C 135 82, 120 80, 105 72 C 80 60, 60 62, 40 68 Z" fill="url(#f1Red)" />
    <path d="M 150 76 L 165 76 L 162 82 L 146 82 Z" fill="#FFFFFF" />
    
    <line x1="10" y1="85" x2="35" y2="85" stroke="#FF0026" stroke-width="2" stroke-dasharray="5 3" />
    <line x1="20" y1="90" x2="55" y2="90" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 4" />
