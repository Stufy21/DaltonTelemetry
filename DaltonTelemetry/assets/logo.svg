    <text x="6" y="14" font-family="'Arial', sans-serif" font-size="10" font-weight="900" fill="#00E5FF" letter-spacing="0.5">DALTON</text>
    <rect x="57" y="0" width="28" height="20" rx="3" fill="#00E5FF" />
